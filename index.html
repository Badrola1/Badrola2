<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badrola | روابطي الشخصية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #090d16, #111827);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 25px;
            text-align: center;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-btn {
            background-color: #1e293b;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            border: 1px solid #334155;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .link-btn:hover {
            background-color: #38bdf8;
            color: #090d16;
            border-color: #38bdf8;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- صورة الملف الشخصي -->
        <img src="1000048956.jpg" alt="Badrola" class="profile-img">
        
        <!-- الاسم -->
        <h1>Badrola</h1>
        <p>تابعني على جميع المنصات الرسمية:</p>

        <div class="links-list">
            <!-- يوتيوب -->
            <a href="https://youtube.com/@badrooola?si=oMzKkHQouf3lAUZO" target="_blank" class="link-btn">قناة اليوتيوب (YouTube)</a>
            
            <!-- تيك توك -->
            <a href="https://www.tiktok.com/@_badrola?_r=1&_t=ZS-9BEd3rjHFjA" target="_blank" class="link-btn">حساب التيك توك (TikTok)</a>
            
            <!-- ديسكورد -->
            <a href="https://discord.gg/4BZESAqrP" target="_blank" class="link-btn">سيرفر الديسكورد (Discord)</a>
            
            <!-- واتساب -->
            <a href="https://whatsapp.com/channel/0029VbCPS0h9MF8uxB0AwW1u" target="_blank" class="link-btn">قناة الواتساب (WhatsApp)</a>
        </div>
    </div>

</body>
</html>
